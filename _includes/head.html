<meta charset="utf-8">
		<link rel="preconnect" href="https://cdn.ampproject.org">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://cdn.ampproject.org/v0.js" rel="preload" as="script">
		<script async src="https://cdn.ampproject.org/v0.js"></script> 
		<style amp-boilerplate>
			{% include css/head2.css %}
		</style>
		<noscript>
			<style amp-boilerplate>
				body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}
			</style>
		</noscript> 
		<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1"> 
		<script async custom-element="amp-video" src="https://cdn.ampproject.org/v0/amp-video-0.1.js"></script>
		<script async custom-element="amp-cache-url" src="https://cdn.ampproject.org/v0/amp-cache-url-0.1.js"></script> 
		<script async custom-element="amp-analytics" src="https://cdn.ampproject.org/v0/amp-analytics-0.1.js"></script>
		<script async custom-element="amp-social-share" src="https://cdn.ampproject.org/v0/amp-social-share-0.1.js"></script>
		<script async custom-element="amp-story" src="https://cdn.ampproject.org/v0/amp-story-1.0.js"></script> 
		

		<title>{{ site.title }}</title>
		<meta name="description" content="{{ site.description }}">
		<link rel="canonical" href="{{ site.url }}/">

		<meta property="og:type" content="profile">
		<meta property="og:site_name" content="Juan (John) Tubert">
		<meta property="og:url" content="{{ site.url }}/">
		<meta property="og:title" content="{{ site.title }}">
		<meta property="og:description" content="{{ site.description }}">
		<meta property="og:image" content="{{ site.url }}/assets/story-poster-landscape.jpg">
		<meta property="og:image:width" content="853">
		<meta property="og:image:height" content="640">
		<meta property="og:image:alt" content="Juan (John) Tubert">
		<meta property="profile:first_name" content="Juan">
		<meta property="profile:last_name" content="Tubert">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:site" content="@tombras">
		<meta name="twitter:creator" content="@{{ site.twitter_username }}">
		<meta name="twitter:title" content="{{ site.title }}">
		<meta name="twitter:description" content="{{ site.description }}">
		<meta name="twitter:image" content="{{ site.url }}/assets/story-poster-landscape.jpg">
		<meta name="twitter:image:alt" content="Juan (John) Tubert">

		<script type="application/ld+json">
		{
		  "@context": "https://schema.org",
		  "@type": "Person",
		  "name": "Juan Tubert",
		  "alternateName": ["John Tubert", "Juan (John) Tubert"],
		  "url": "{{ site.url }}/",
		  "image": "{{ site.url }}/assets/story-poster-square.jpg",
		  "jobTitle": "Chief Technology Officer",
		  "description": {{ site.description | jsonify }},
		  "worksFor": {
		    "@type": "Organization",
		    "name": "Tombras",
		    "url": "https://www.tombras.com/"
		  },
		  "sameAs": ["https://www.linkedin.com/in/jtubert/"]
		}
		</script>
		<script type="application/ld+json">
		{
		  "@context": "https://schema.org",
		  "@type": "Article",
		  "headline": "{{ site.title }}",
		  "description": {{ site.description | jsonify }},
		  "image": [
		    "{{ site.url }}/assets/story-poster-square.jpg",
		    "{{ site.url }}/assets/story-poster-portrait.jpg",
		    "{{ site.url }}/assets/story-poster-landscape.jpg"
		  ],
		  "author": { "@type": "Person", "name": "Juan Tubert", "url": "{{ site.url }}/" },
		  "publisher": {
		    "@type": "Organization",
		    "name": "Juan (John) Tubert",
		    "logo": {
		      "@type": "ImageObject",
		      "url": "{{ site.url }}/assets/story-publisher-logo.jpg",
		      "width": 256,
		      "height": 256
		    }
		  },
		  "datePublished": "2021-01-01",
		  "dateModified": "{{ site.time | date: '%Y-%m-%d' }}",
		  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ site.url }}/" }
		}
		</script>
		<style amp-custom>
			{% include css/head.css %}
		</style> 
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" media="all">
