<amp-story-page id="aklmvecujp" class="pg-cover ms-st-pg" auto-advance-after="7000ms">

  <amp-story-grid-layer template="fill" class="bleed">
    <amp-img layout="fill" src="{{ include.asset }}" alt="Juan Tubert"></amp-img>
  </amp-story-grid-layer>

  <amp-story-grid-layer template="vertical">
    <div class="frame">
      <div class="veil"></div>
      <div class="veil-top"></div>

      <div class="cover-text">
        <div class="cover-rule"></div>
        <h1 class="cover-name">Juan<br>Tubert</h1>
        <p class="cover-role">Chief Technology Officer at Tombras.</p>
      </div>

      <div class="cover-foot">
        <span class="handle">in/jtubert</span>
        <amp-img class="brand" layout="responsive" width="424" height="119" src="assets/tombras-logo-alpha.png" alt="Tombras"></amp-img>
      </div>
    </div>
  </amp-story-grid-layer>

  <amp-story-animation layout="nodisplay" trigger="visibility">
    <script type="application/json">
      [{"selector":".cover-name","duration":"620ms","fill":"forwards","delay":"140ms","keyframes":[{"offset":0,"opacity":0,"transform":"translateY(18px)"},{"offset":1,"opacity":1,"transform":"translateY(0)"}]},{"selector":".cover-role","duration":"560ms","fill":"forwards","delay":"320ms","keyframes":[{"offset":0,"opacity":0,"transform":"translateY(16px)"},{"offset":1,"opacity":1,"transform":"translateY(0)"}]}]
    </script>
  </amp-story-animation>
</amp-story-page>
