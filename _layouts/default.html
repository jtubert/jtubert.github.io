---
layout: html_minifier
---
<!doctype html> 
	<html amp lang="en"> 
	<head> 
		{% include head.html %}
	</head> 
	<body> 
		<amp-story standalone class="ms-MNVBQ6cWkqfHOq9JgBM" poster-portrait-src="assets/story-poster-portrait.jpg" publisher-logo-src="assets/story-publisher-logo.jpg" publisher="Juan (John) Tubert" title="Juan (John) Tubert — CTO at Tombras" poster-landscape-src="assets/story-poster-landscape.jpg" poster-square-src="assets/story-poster-square.jpg"> 
			{{ content }}
			{%- comment -%}
			  GA4 for the AMP story. AMP forbids arbitrary <script>, so the gtag.js
			  snippet the ordinary pages use (_includes/analytics.html) is not an
			  option here; amp-analytics is. Same property, different tag.

			  Every trigger used to send event_name "custom" with UA's
			  event_action/category/label. GA4 has no such fields, so that shape
			  reported every interaction as one event called "custom". The names are
			  now the events themselves and the rest are ordinary parameters.
			{%- endcomment -%}
			<amp-analytics type="gtag" data-credentials="include">
			<script type="application/json">
	        {"vars":{"gtag_id":"{{ site.google_analytics }}","config":{"{{ site.google_analytics }}":{"groups":"default"}}},"triggers":{"storyProgress":{"on":"story-page-visible","vars":{"event_name":"story_progress","story_title":"${title}","story_page_id":"${storyPageId}","send_to":["{{ site.google_analytics }}"]}},"storyEnd":{"on":"story-last-page-visible","vars":{"event_name":"story_complete","story_title":"${title}","send_to":["{{ site.google_analytics }}"]}},"anchorClicks":{"on":"click","selector":"a.cta-a","vars":{"event_name":"cta_click","story_title":"${title}","link_url":"${ctalink}","send_to":["{{ site.google_analytics }}"]}},"tooltipClickThrough":{"on":"story-click-through","vars":{"event_name":"story_click_through","story_title":"${title}","link_url":"${ctalink}","send_to":["{{ site.google_analytics }}"]}},"tooltipFocus":{"on":"story-focus","vars":{"event_name":"story_link_focus","story_title":"${title}","link_url":"${ctalink}","send_to":["{{ site.google_analytics }}"]}}}}
			</script>
	        </amp-analytics>
			<amp-story-bookend src="https://jtubert.com/getStoryBookend" layout="nodisplay"></amp-story-bookend> 
		</amp-story>
	</body> 
</html>
