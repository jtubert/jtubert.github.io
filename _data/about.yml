- q: What does Juan Tubert speak and write about?
  lead: >-
    Mostly AI: how it changes the way an agency operates rather than only what
    it produces, and what it costs, from bias to energy use.
  more: >-
    <ul>
    <li><a href="/work/sxsw/">The danger of bias in AI</a>, SXSW, 2019</li>
    <li><a href="/work/ojo3/">How to use AI to build a more efficient agency</a>,
    El Ojo de Iberoamérica, Buenos Aires, 2025, with Gonzalo Vecino</li>
    <li><a href="/work/adweek/">Why voice assistants failed people with accents</a>,
    Adweek, 2017</li>
    <li><a href="/work/podcast/">GPT-3</a>, R/GA's FutureVision podcast, 2020</li>
    </ul>

- q: Where is Juan Tubert from?
  lead: >-
    Buenos Aires, Argentina.
  more: >-
    <p>That became part of the job in August 2024, when Tombras acquired Niña,
    an independent creative agency in Buenos Aires, which now operates as
    TombrasNiña. Several of his talks and interviews since then have been in
    Spanish, including <a href="/work/ojo3/">El Ojo de Iberoamérica</a>.</p>
    <p class="src">Source: <a href="/work/argentina/">Tombras expands globally with acquisition of Argentine agency</a></p>

