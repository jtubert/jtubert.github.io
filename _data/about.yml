# The questions on /about/, in the words people actually ask them.
#
# `lead` is the direct answer and comes first. It is also what the FAQPage
# structured data says, so the markup can never claim something the page does
# not show. `more` is the supporting detail: lists, tables, links to the source.
#
# Every fact is already published on the /work/ page it links to. Nothing here
# is new information, only a different arrangement of it.

- q: What does Juan Tubert do at Tombras?
  lead: >-
    He is Chief Technology Officer at Tombras, and has been since June 2022. He
    joined to be somewhere independent, where technology sits close enough to
    the creative work to change what gets made rather than only how it gets
    delivered.
  more: >-
    <ul>
    <li>He built an <a href="/work/tombrasai/">internal AI platform</a> of
    specialised agents, each aimed at one task and switched on only when a job
    needs it, and presented it to the whole agency.</li>
    <li>He built the API and cloud system behind the
    <a href="/work/googlepods/">PODS campaign with Google Gemini</a>, a moving
    billboard whose message changed with its location as it drove through New
    York City. It won a <a href="/work/webby/">2025 Webby for Best Experiential
    Design</a>.</li>
    </ul>
    <p class="src">Source: <a href="/work/tombras/">New position as Chief Technology Officer at Tombras</a></p>

- q: Where did Juan Tubert work before Tombras?
  lead: >-
    At R/GA, for seventeen years, until 2022. He joined when Flash was how
    interesting work was built on the web and left when the interesting problems
    had moved to machine learning.
  more: >-
    <p>The work changed underneath him the whole time: Flash, then mobile, then
    connected products, then voice, then AI. His roles there included Executive
    Technology Director, when he <a href="/work/sxsw/">spoke at SXSW in 2019</a>,
    and SVP and head of technology in New York, when he
    <a href="/work/podcast/">discussed GPT-3 on R/GA's FutureVision podcast</a>
    in 2020.</p>
    <p class="src">Source: <a href="/work/rga_flash/">After 17 years at R/GA</a></p>

- q: What book did Juan Tubert write?
  lead: >-
    <cite>You Work for Your User: How to Design User-Centric Products in the
    Age of AI</cite>, published in February 2026 and co-written with Brian Hanley
    and Rick Barber.
  more: >-
    <table>
    <tr><th scope="row">Title</th><td><cite>You Work for Your User: How to Design User-Centric Products in the Age of AI</cite></td></tr>
    <tr><th scope="row">Authors</th><td>Brian Hanley, who leads product management at Comcast; Juan Tubert; Rick Barber, CTO and co-founder of Addition</td></tr>
    <tr><th scope="row">Published</th><td>February 2026</td></tr>
    <tr><th scope="row">ISBN</th><td>9798245898667</td></tr>
    <tr><th scope="row">Argument</th><td>AI is an amplifier, not a replacement. A model can produce a thousand variations and cannot tell you which one will land.</td></tr>
    </table>
    <p class="src">Source: <a href="/work/book/">You Work for Your User</a></p>

